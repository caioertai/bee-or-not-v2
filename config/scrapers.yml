development: &default
  babylon_bee:
    base_url: "https://babylonbee.com"
    api_path: "/loadArticles"
    source_slug: "babylon-bee"
    source_name: "The Babylon Bee"
    real: false
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"
    headers:
      content_type: "application/json"
      accept: "application/json, text/plain, */*"
      accept_language: "en-US,en;q=0.9"
      x_requested_with: "XMLHttpRequest"
      sec_fetch_dest: "empty"
      sec_fetch_mode: "cors"
      sec_fetch_site: "same-origin"
    request_params:
      category: "latest"
      sort: "desc"
      take: 12
      is_author: false

  not_the_bee:
    base_url: "https://notthebee.com"
    api_path: "/loadArticles"
    source_slug: "not-the-bee"
    source_name: "Not the Bee"
    real: true
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"
    headers:
      content_type: "application/json"
      accept: "application/json, text/plain, */*"
      accept_language: "en-US,en;q=0.9,es;q=0.8"
      x_requested_with: "XMLHttpRequest"
      sec_fetch_dest: "empty"
      sec_fetch_mode: "cors"
      sec_fetch_site: "same-origin"
    request_params:
      category: "latest"
      sort: "desc"
      take: 12
      is_author: false

test:
  <<: *default

production:
  <<: *default